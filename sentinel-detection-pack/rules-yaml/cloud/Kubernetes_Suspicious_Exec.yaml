id: 8a1b2c3d-4e5f-4a7b-8c9d-0e1f2a3b4c5d
name: "Kubernetes: Suspicious Container Execution"
description: |
  Detects when a user executes an interactive terminal, such as /bin/bash or /bin/sh,
  inside a running Kubernetes container using kubectl exec. This is a primary technique
  (T1609) for attackers administering containers or moving laterally in cloud-native environments.
severity: High
status: Production
requiredDataConnectors:
  - connectorId: AzureKubernetesService
    dataTypes:
      - AKSAudit
      - AKSAuditAdmin
queryFrequency: PT5M
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - Execution
techniques:
  - T1609
query: |
  let suspicious_commands = dynamic(["/bin/bash", "/bin/sh", "curl", "wget", "nc"]);
  AKSAuditAdmin
  | where Category == "kube-audit"
  | extend log_json = parse_json(Log)
  | where log_json.verb == "create"
  | where log_json.objectRef.resource == "pods" and log_json.objectRef.subresource == "exec"
  | extend command = tostring(log_json.requestObject.command)
  | where command has_any (suspicious_commands)
  | project TimeGenerated,
      User=tostring(log_json.user.username),
      Pod=tostring(log_json.objectRef.name),
      Namespace=tostring(log_json.objectRef.namespace),
      Command=command,
      SourceIP=tostring(log_json.sourceIPs[0])
  | extend AccountCustomEntity = User
  | extend IPCustomEntity = SourceIP
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: User
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP
kind: Scheduled
version: 1.0.0
