<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SentinelOS - a multi-cloud DevSecOps & Detection-as-Code platform for Microsoft Sentinel: Infrastructure-as-Code, a policy-gated CI/CD pipeline, CIS/NIST compliance mapping, and an AI-assisted SOC control plane." />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Open Graph -->
    <meta property="og:title" content="SentinelOS — Cloud Security Operations Platform" />
    <meta property="og:description" content="Multi-cloud DevSecOps & Detection-as-Code for Microsoft Sentinel: IaC, policy-gated CI/CD, CIS/NIST compliance, and an AI-assisted SOC." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SentinelOS" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SentinelOS — Cloud Security Operations Platform" />
    <meta name="twitter:description" content="Multi-cloud DevSecOps & Detection-as-Code for Microsoft Sentinel: IaC, policy-gated CI/CD, CIS/NIST compliance, and an AI-assisted SOC." />

    <title>SentinelOS | Cloud Security Operations Platform</title>
    
    <style>
      /* Loading state */
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border: 3px solid #1e293b;
        border-top-color: #14b8a6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      #root:empty::before {
        content: 'Loading SentinelOS...';
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        transform: translateX(-50%);
        color: #64748b;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      html {
        background-color: #020617;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
