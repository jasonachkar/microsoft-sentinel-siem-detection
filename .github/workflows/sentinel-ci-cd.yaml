name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scans:
    name: Shift-Left Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFSec Core Azure Infrastructure Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          working_directory: ./terraform

      - name: TFSec Honeypot Infrastructure Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          working_directory: ./terraform-honeypot

      - name: TFSec SOAR Infrastructure Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          working_directory: ./terraform-soar

      - name: TFSec AWS Connector Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          working_directory: ./terraform-aws-connector

      - name: Trivy Vulnerability Scanner (AppSec)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  validate-and-build:
    name: Validate & Bundle Rules
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Validate Sentinel Rules
        run: |
          chmod +x ./scripts/validate-rules.sh
          ./scripts/validate-rules.sh --check-samples

      - name: Bundle Detection Rules
        run: |
          chmod +x ./scripts/bundle-rules.sh
          ./scripts/bundle-rules.sh

      - name: Upload Bundles as Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-rules-bundle
          path: sentinel-detection-pack/bundles/
          retention-days: 14

  detection-assertion:
    name: Detection-as-Code Assertion
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Assert Atomic Red Team Detection
        run: python scripts/assert-detection.py

  threat-intel-ingestion:
    name: Threat Intelligence Ingestion
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Threat Intelligence Pipeline
        run: python scripts/threat-intel-ingest.py

  deploy-to-sentinel:
    name: Deploy SIEM & SOAR
    needs:
      - validate-and-build
      - detection-assertion
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Bundles Artifact
        uses: actions/download-artifact@v4
        with:
          name: sentinel-rules-bundle
          path: bundles/

      - name: Execute Deployment
        run: |
          echo "Deployment execution via Go CLI runs here."
          echo "SOAR playbook deployment uses terraform-soar/ and OIDC-backed Azure authentication."
