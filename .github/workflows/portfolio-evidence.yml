name: Portfolio UI Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/cloud-security-reviewer-experience
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: 'Commit generated evidence/ui screenshots to the branch (default false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  portfolio-evidence:
    name: Playwright reviewer evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-detection-pack/ui

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5286ca86487a76625f2b52b30c9632b88 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sentinel-detection-pack/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build UI
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Generate evidence screenshots
        run: npm run evidence:screenshots
        env:
          CI: true

      - name: Upload portfolio UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e93b4886f43307c025 # v4
        with:
          name: portfolio-ui-screenshots
          path: evidence/ui/
          if-no-files-found: error

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e93b4886f43307c025 # v4
        with:
          name: playwright-report
          path: sentinel-detection-pack/ui/playwright-report/
          if-no-files-found: warn

  detection-tests:
    name: Detection metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@8a9b1d2f2f75e9b7e0955bcda36efd632b0f4707 # v5
        with:
          python-version: '3.12'
      - name: Run detection tests
        run: python scripts/test-detections.py

  go-tests:
    name: Go deployer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@41eea8811599e0937651069dae782978d945002a # v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: src-cli
        run: go test ./...

  optional-commit-screenshots:
    name: Commit screenshots (manual dispatch only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.commit_screenshots == 'true' &&
      github.repository == 'jasonachkar/microsoft-sentinel-siem-detection'
    needs: portfolio-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download screenshots
        uses: actions/download-artifact@65aa7837738e8fc0e432748d68318e2e3618b432 # v4
        with:
          name: portfolio-ui-screenshots
          path: evidence/ui

      - name: Commit and push screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ui/*.png evidence/ui/evidence-index.md
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh UI evidence screenshots from portfolio-evidence workflow"
          git push
