name: Portfolio UI Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/cloud-security-reviewer-experience
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: 'Commit generated evidence/ui screenshots to the branch (default false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  portfolio-evidence:
    name: Playwright reviewer evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-detection-pack/ui

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sentinel-detection-pack/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build UI
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e:built
        env:
          CI: true
        timeout-minutes: 15

      - name: Start preview server for screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 >/dev/null; then
              echo "Preview server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview server failed to start"
          exit 1

      - name: Generate evidence screenshots
        run: npm run evidence:screenshots
        env:
          CI: true
          PORTFOLIO_EVIDENCE_URL: http://127.0.0.1:4173
        timeout-minutes: 10

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" 2>/dev/null || true
          fi

      - name: Upload portfolio UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-ui-screenshots
          path: evidence/ui/
          if-no-files-found: error

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: sentinel-detection-pack/ui/playwright-report/
          if-no-files-found: warn

  detection-tests:
    name: Detection metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Run detection tests
        run: python scripts/test-detections.py

  go-tests:
    name: Go deployer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: src-cli
        run: go test ./...

  optional-commit-screenshots:
    name: Commit screenshots (manual dispatch only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.commit_screenshots == 'true' &&
      github.repository == 'jasonachkar/microsoft-sentinel-siem-detection'
    needs: portfolio-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-ui-screenshots
          path: evidence/ui

      - name: Commit and push screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ui/*.png evidence/ui/evidence-index.md
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh UI evidence screenshots from portfolio-evidence workflow"
          git push
